android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx8192m

# Versioning
VERSION_NAME=0.9.3
VERSION_CODE=70
# Installed identity (and thus the local data directory).
APP_ID=com.blinkingblue.inmessages
# Code namespace for the generated R, BuildConfig and databinding classes. Deliberately separate
# from APP_ID: changing it would move those classes and require rewriting every import.
APP_NAMESPACE=org.fossify.messages
