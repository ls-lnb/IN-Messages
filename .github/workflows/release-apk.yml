name: Release universal APK

# Builds the foss flavor and publishes a GitHub Release with a single universal
# APK (no ABI splits are configured, so one APK covers all architectures).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Signed, minified release when signing secrets are configured, otherwise
      # an installable debug-signed APK (same .debug application id you already use).
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_B64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gate the release on the unit tests (OTP formats plus the message corpus).
      - name: Run unit tests
        run: ./gradlew testFossDebugUnitTest

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
        run: ./gradlew assembleFossRelease

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_SIGNING != 'true'
        run: ./gradlew assembleFossDebug

      - name: Collect APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/foss -name "*.apk" ! -name "*unsigned*" ! -name "*sources*" | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No installable APK was produced"
            exit 1
          fi
          version=$(grep -oP '(?<=^VERSION_NAME=).*' gradle.properties)
          named="IN-Messages-$version.apk"
          cp "$apk" "$named"
          echo "path=$named" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -lh "$named"

      - name: Create GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "IN Messages ${{ steps.apk.outputs.version }} (#${{ github.run_number }})"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          append_body: |
            **Licence:** GNU GPL-3.0. This build is a fork of
            [Fossify Messages](https://github.com/FossifyOrg/Messages), with thanks to
            the Fossify team.

            **Source:** the corresponding source for this build is
            [build-${{ github.run_number }}](https://github.com/ls-lnb/messages-lnb/tree/build-${{ github.run_number }})
            (commit `${{ github.sha }}`); the README explains how to build it.
          files: ${{ steps.apk.outputs.path }}
